<!doctype html>
<!--
  Deterministic scene for the StitchAPI hero demo (streaming-demo.{mp4,gif}).

  Every pixel is a pure function of time: the generator script calls
  window.__seek(t) and screenshots each frame — there are no timers, no
  Date.now(), no randomness, no CSS animations. Re-rendering the same t
  always produces the same frame, which is what makes the asset
  regenerable from source (see scripts/gen-streaming-demo.mjs).

  Layouts: default is 1280x720 split view; ?layout=square is a 1080x1080
  stacked view for the social crop.

  The on-screen snippet is real StitchAPI usage — it mirrors the
  useStitchStream JSDoc example in packages/react/src/index.ts.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>StitchAPI — streaming demo scene</title>
        <style>
            :root {
                --accent: #2563eb;
                --accent-soft: #dbeafe;
                --green: #16a34a;
                --green-soft: #dcfce7;
                --ink: #0f172a;
                --muted: #64748b;
                --border: #e2e8f0;
                --page: #f1f5f9;
                --card: #ffffff;
                --code-bg: #0b1220;
                --code-ink: #e2e8f0;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1280px;
                height: 720px;
                overflow: hidden;
            }
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                background: radial-gradient(
                        1100px 600px at 18% -10%,
                        #e8effc 0%,
                        rgba(232, 239, 252, 0) 60%
                    ),
                    var(--page);
                color: var(--ink);
                display: flex;
                flex-direction: column;
                padding: 34px 44px 40px;
            }

            /* ── brand bar ─────────────────────────────────────────── */
            .brand {
                display: flex;
                align-items: center;
                gap: 13px;
                margin-bottom: 26px;
            }
            .brand .glyph {
                width: 34px;
                height: 34px;
                border-radius: 9px;
                background: var(--accent);
                color: #fff;
                font-weight: 800;
                font-size: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .brand .name {
                font-size: 23px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }
            .brand .tag {
                margin-left: auto;
                font-size: 18px;
                color: var(--muted);
            }

            /* ── panels ────────────────────────────────────────────── */
            .stage {
                flex: 1;
                display: flex;
                gap: 24px;
                min-height: 0;
            }
            .code-card {
                flex: 0 0 45%;
                background: var(--code-bg);
                border-radius: 18px;
                padding: 26px 30px;
                box-shadow: 0 18px 40px -18px rgba(15, 23, 42, 0.35);
                display: flex;
                flex-direction: column;
            }
            .dots {
                display: flex;
                gap: 8px;
                margin-bottom: 22px;
            }
            .dots i {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }
            .dots i:nth-child(1) {
                background: #f87171;
            }
            .dots i:nth-child(2) {
                background: #fbbf24;
            }
            .dots i:nth-child(3) {
                background: #34d399;
            }
            pre {
                font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                font-size: 23px;
                line-height: 1.62;
                color: var(--code-ink);
                white-space: pre;
                margin: auto 0; /* center in the card's leftover height */
            }
            .k {
                color: #c792ea;
            }
            .f {
                color: #82aaff;
            }
            .s {
                color: #c3e88d;
            }
            .p {
                color: #8fa3bf;
            }
            .t {
                color: #7dd3fc;
            }

            .result-card {
                flex: 1;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 26px 32px;
                box-shadow: 0 18px 40px -22px rgba(15, 23, 42, 0.18);
                display: flex;
                flex-direction: column;
            }
            .result-head {
                display: flex;
                align-items: center;
                margin-bottom: 24px;
            }
            .result-head .title {
                font-size: 19px;
                font-weight: 600;
                color: var(--muted);
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }

            /* static prompt chip — ties the reply to `body: { prompt }` and
               keeps the panel alive during the loop's empty phase */
            .prompt-chip {
                align-self: flex-start;
                font-size: 18px;
                color: var(--muted);
                background: #f1f5f9;
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 7px 16px;
                margin-bottom: 22px;
            }
            .prompt-chip b {
                color: var(--ink);
                font-weight: 500;
            }

            /* badge (streaming ⇄ done) */
            .badge {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 9px;
                font-size: 17.5px;
                font-weight: 600;
                border-radius: 999px;
                padding: 8px 18px;
            }
            .badge.stream {
                background: var(--accent-soft);
                color: var(--accent);
            }
            .badge.done {
                background: var(--green-soft);
                color: var(--green);
            }
            .badge .pulse {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: var(--accent);
            }

            /* streamed content */
            .sentence {
                font-size: 27px;
                font-weight: 500;
                line-height: 1.45;
                min-height: 40px;
                letter-spacing: -0.005em;
            }
            .caret {
                display: inline-block;
                width: 13px;
                height: 29px;
                border-radius: 3px;
                background: var(--accent);
                vertical-align: -4px;
                margin-left: 3px;
            }
            .rows {
                margin-top: 26px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 18px;
                background: #f8fafc;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 15px 20px;
            }
            .row .icon {
                width: 44px;
                height: 44px;
                border-radius: 11px;
                background: var(--accent-soft);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 23px;
            }
            .row .when {
                font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                font-size: 20px;
                color: var(--muted);
                width: 84px;
            }
            .row .what {
                font-size: 23px;
                font-weight: 500;
                white-space: nowrap;
            }

            /* ── square (1080x1080) layout ─────────────────────────── */
            body.square {
                width: 1080px;
                height: 1080px;
                padding: 40px 46px 46px;
            }
            body.square .stage {
                flex-direction: column;
            }
            body.square .code-card {
                flex: 0 0 auto;
            }
            body.square pre {
                font-size: 22px;
            }
        </style>
    </head>
    <body>
        <div class="brand">
            <div class="glyph">S</div>
            <div class="name">StitchAPI</div>
            <div class="tag">the streaming-first API client</div>
        </div>

        <div class="stage">
            <div class="code-card">
                <div class="dots"><i></i><i></i><i></i></div>
                <pre><span class="k">const</span> chat = <span class="f">stitch</span><span class="p">({</span>
    path<span class="p">:</span> <span class="s">'https://api.example.com/chat'</span><span class="p">,</span>
    output<span class="p">:</span> <span class="t">Reply</span><span class="p">,</span>
<span class="p">});</span>

<span class="k">const</span> <span class="p">{</span> chunks<span class="p">,</span> isStreaming <span class="p">}</span> =
    <span class="f">useStitchStream</span><span class="p">(</span>chat<span class="p">,</span> <span class="p">{</span> body<span class="p">:</span> <span class="p">{</span> prompt <span class="p">}</span> <span class="p">});</span></pre>
            </div>

            <div class="result-card">
                <div class="result-head">
                    <div class="title">Response</div>
                    <div class="badge stream" id="badge">
                        <span class="pulse" id="pulse"></span>
                        <span id="badgeText">streaming</span>
                    </div>
                </div>
                <div class="prompt-chip">
                    prompt · <b>“Plan my day in Kyiv”</b>
                </div>
                <div id="content">
                    <div class="sentence">
                        <span id="sentence"></span
                        ><span class="caret" id="caret"></span>
                    </div>
                    <div class="rows" id="rows"></div>
                </div>
            </div>
        </div>

        <script>
            'use strict';

            if (
                new URLSearchParams(location.search).get('layout') === 'square'
            ) {
                document.body.classList.add('square');
            }

            // ── timeline (seconds) ─────────────────────────────────────
            const TOTAL = 6.4; // full loop
            const BADGE_IN = 0.15; // "● streaming" fades in
            const DONE_AT = 4.45; // stream completes → green chip
            const FADE_AT = 5.7; // content fades back to empty
            const FADE_LEN = 0.35; // …over this long (then rest until TOTAL)

            // Sentence streams in LLM-ish sub-word chunks, then rows land
            // one by one. Fixed schedule — same frames every render.
            const CHUNKS = [
                ['Your', 0.35],
                [' 3', 0.53],
                ['-stop', 0.68],
                [' day', 0.86],
                [' in', 1.02],
                [' Ky', 1.2],
                ['iv', 1.34],
                [':', 1.5],
            ];
            const ROWS = [
                [2.05, '☕', '09:00', 'Coffee at Podil'],
                [2.85, '⛪', '12:30', 'Saint Sophia Cathedral'],
                [3.65, '🌅', '19:00', 'Sunset over the Dnipro'],
            ];

            const $ = (id) => document.getElementById(id);
            const badge = $('badge');
            const badgeText = $('badgeText');
            const pulse = $('pulse');
            const sentence = $('sentence');
            const caret = $('caret');
            const content = $('content');
            const rowsEl = $('rows');

            const rowEls = ROWS.map(([, icon, when, what]) => {
                const el = document.createElement('div');
                el.className = 'row';
                el.innerHTML =
                    '<div class="icon">' +
                    icon +
                    '</div><div class="when">' +
                    when +
                    '</div><div class="what">' +
                    what +
                    '</div>';
                rowsEl.appendChild(el);
                return el;
            });

            const clamp01 = (x) => Math.min(1, Math.max(0, x));
            const easeOut = (p) => 1 - Math.pow(1 - p, 3);
            const easeOutBack = (p) => {
                const c = 1.70158;
                return (
                    1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2)
                );
            };

            function render(tAbs) {
                const t = ((tAbs % TOTAL) + TOTAL) % TOTAL;
                const streaming = t < DONE_AT;
                const fade = 1 - clamp01((t - FADE_AT) / FADE_LEN);

                // badge: in → pulsing blue → green pop → fades with the rest
                const badgeIn = clamp01((t - BADGE_IN) / 0.25);
                badge.style.opacity = badgeIn * fade;
                if (streaming) {
                    badge.className = 'badge stream';
                    badgeText.textContent = 'streaming';
                    pulse.style.display = '';
                    const ph = 0.5 + 0.5 * Math.sin(2 * Math.PI * 1.3 * t);
                    pulse.style.opacity = 0.45 + 0.55 * ph;
                    pulse.style.transform = 'scale(' + (0.8 + 0.35 * ph) + ')';
                    badge.style.transform = 'scale(1)';
                } else {
                    badge.className = 'badge done';
                    badgeText.textContent = '✓ typed · validated';
                    pulse.style.display = 'none';
                    const pop = clamp01((t - DONE_AT) / 0.3);
                    badge.style.transform =
                        'scale(' + (0.8 + 0.2 * easeOutBack(pop)) + ')';
                }

                // sentence: tokens whose time has passed
                let text = '';
                for (const [chunk, at] of CHUNKS) if (t >= at) text += chunk;
                sentence.textContent = text;

                // caret: blinks while streaming, gone once done
                const blink = Math.sin(2 * Math.PI * 2 * t) > 0 ? 1 : 0.15;
                caret.style.opacity = streaming && t >= BADGE_IN ? blink : 0;

                // rows: slide-up + fade, one by one
                rowEls.forEach((el, i) => {
                    const p = easeOut(clamp01((t - ROWS[i][0]) / 0.3));
                    el.style.opacity = p;
                    el.style.transform = 'translateY(' + 16 * (1 - p) + 'px)';
                });

                // loop-close: everything fades back to the empty panel
                content.style.opacity = fade;
            }

            window.__TOTAL = TOTAL;
            window.__seek = render;
            render(0);
        </script>
    </body>
</html>
