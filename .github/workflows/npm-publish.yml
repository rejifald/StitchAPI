# Publishes the package to npm when a GitHub release is created. Publishing is
# gated on the full verify suite passing first. See ~/Development/handbook
# conventions/global/ci-canonical.md §13.
name: Publish

on:
    release:
        types: [created]

# Default-deny at the top; elevate per-job only where needed.
permissions:
    contents: read

# Never cancel an in-flight publish; queue instead.
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check:format
            - run: npm run check:lint
            - run: npm run check:types
            - run: npm run test:coverage
            - run: npm run check:exports
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    publish-npm:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org/
                  cache: npm
            - run: npm ci
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
