# Publishes the packages to npm when a GitHub release is created, gated on the verify
# suite and the browser e2e gate. Authentication is **OIDC trusted publishing** (no
# long-lived npm token): the publish job mints a short-lived id-token that npm exchanges
# for publish rights. Each package must have a Trusted Publisher configured on npmjs.com
# (package Settings → Trusted Publisher → repo `rejifald/StitchAPI`, this workflow file).
#
# NOTE: a package's FIRST version cannot be published over OIDC — npm needs the package to
# exist before a publisher can be attached. Bootstrap a brand-new package once with a local
# interactive publish (see docs/RELEASING.md), then it rides this workflow for every release.
# See ~/Development/handbook conventions/global/ci-canonical.md §13.
name: Publish

on:
    release:
        types: [created]

# Default-deny at the top; elevate per-job only where needed.
permissions:
    contents: read

# Never cancel an in-flight publish; queue instead.
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # Fast fail-first gate. Before the ~15-min verify + e2e gates run (let alone a
    # publish), reject a release whose tag does not match the version in the commit it
    # points at. This catches the classic mistake of cutting the release tag on a commit
    # from *before* the version-bump PR merged (e.g. tagging `main`'s old tip): the tag
    # then carries an rc.3 label over an rc.2 tree, which previously only surfaced at the
    # publish step's `check-release --release-tag` after the whole gate had already run.
    # The publish job keeps that authoritative check as defense-in-depth; this just fails
    # in seconds with a fix-it message.
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Release tag must match the tagged commit's version
              run: |
                  set -euo pipefail
                  TAG="${{ github.event.release.tag_name }}"
                  VERSION="$(node -p "require('./packages/core/package.json').version")"
                  if [ "$TAG" != "v$VERSION" ]; then
                      echo "::error title=Release tag/version mismatch::Release tag '$TAG' points at a commit whose package version is 'v$VERSION'. The tag was almost certainly cut on a commit from before the version-bump PR merged. Re-point it to the bumped commit — \`git tag -f $TAG <bump-commit> && git push -f origin $TAG\` — or delete and re-create the release on that commit, then re-run."
                      exit 1
                  fi
                  echo "✓ release tag $TAG matches package version v$VERSION"

    verify:
        needs: preflight
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:format
            - run: pnpm check:lint
            - run: pnpm check:types
            - run: pnpm test:coverage
            - run: pnpm check:exports
            - run: pnpm check:release
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./packages/core/coverage/lcov.info

    # Pre-publish browser gate: the Playwright harness (real Chromium) proves the
    # sandbox CSP + Worker egress blocking and that a RunResult.trace reaches the
    # playground DAG. A release waits on it so we never publish a broken browser
    # sandbox. Mirrors the `e2e` job in verify.yml.
    e2e:
        needs: preflight
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @stitchapi/docs test:e2e:install
            - run: pnpm --filter @stitchapi/docs test:e2e

    publish-npm:
        needs: [verify, e2e]
        runs-on: ubuntu-latest
        # 34 packages publish in one lockstep run, and @stitchapi/docs-mcp rebuilds its
        # bundled docs (a ~90 MB model download) at pack time — 10 min clipped the tail
        # in the rc.5 run (everything past `rtk-query` never published, and docs-mcp's own
        # slow pack pushed it over). 25 gives comfortable headroom; it's a ceiling, not a
        # target — a healthy run still finishes in ~10-13 min.
        timeout-minutes: 25
        permissions:
            contents: read
            id-token: write # mint the OIDC token npm exchanges for publish auth (+ provenance)
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Trusted publishing needs npm >= 11.5.1 — newer than the npm bundled with Node — and
            # pnpm's own OIDC publish is unreliable (pnpm/pnpm#11513), so publish with `npm` below.
            - run: npm install -g npm@latest
            # Build every publishable package up front, so a build failure aborts before anything
            # reaches npm (no partial release).
            - run: pnpm --filter "./packages/*" build
            # Derive the dist-tag from the version and refuse an unsafe release: version lockstep,
            # prerelease-aware peer ranges, scoped access, a prerelease never landing on `latest`,
            # a CHANGELOG entry, and the release tag matching the package version.
            - name: Validate release & derive dist-tag
              id: release
              run: |
                  TAG="$(node scripts/check-release.mjs --print-tag)"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  node scripts/check-release.mjs --changelog --tag "$TAG" --release-tag "${{ github.event.release.tag_name }}"
            # Publish each non-private package over OIDC. `pnpm pack` produces the tarball (it
            # rewrites the `workspace:` protocol and runs each prepack/tsup build); `npm publish`
            # uploads that tarball authenticated by the workflow's id-token — no NODE_AUTH_TOKEN.
            # A version already on the registry is skipped, so a re-run after a partial publish is
            # idempotent. `--provenance` attaches a signed build-provenance attestation.
            #
            # The loop does NOT abort on the first package that fails — it attempts every package,
            # then exits non-zero with the full list of failures. A single missing/mismatched npm
            # Trusted Publisher (ENEEDAUTH/E403) on one package would otherwise mask the state of
            # all the packages after it, turning a release into a blind one-at-a-time grind. Each
            # `npm publish` runs under an `if` so its failure is recorded, not fatal (errexit is
            # exempt inside an `if` condition); successful publishes still land, and the re-run
            # skips them.
            - name: Publish (OIDC trusted publishing)
              run: |
                  set -euo pipefail
                  TAG="${{ steps.release.outputs.tag }}"
                  OUT="$(mktemp -d)"
                  published=() skipped=() failed=()
                  for d in packages/*/; do
                      d="${d%/}"
                      if [ "$(node -p "require('./$d/package.json').private === true")" = "true" ]; then
                          continue
                      fi
                      name="$(node -p "require('./$d/package.json').name")"
                      version="$(node -p "require('./$d/package.json').version")"
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "✓ skip $name@$version (already on the registry)"
                          skipped+=("$name")
                          continue
                      fi
                      tgz="$OUT/$(echo "$name" | sed 's/@//; s#/#-#')-$version.tgz"
                      if ! (cd "$d" && pnpm pack --pack-destination "$OUT" >/dev/null); then
                          echo "::error::pack failed for $name@$version"
                          failed+=("$name")
                          continue
                      fi
                      echo "→ publishing $name@$version under dist-tag '$TAG'"
                      if npm publish "$tgz" --provenance --tag "$TAG"; then
                          echo "✓ published $name@$version"
                          published+=("$name")
                      else
                          echo "::warning::publish failed for $name@$version (likely a missing/mismatched npm Trusted Publisher)"
                          failed+=("$name")
                      fi
                  done
                  echo "── publish summary ────────────────────────────────────"
                  echo "  published (${#published[@]}): ${published[*]:-—}"
                  echo "  skipped   (${#skipped[@]}): ${skipped[*]:-—}"
                  echo "  failed    (${#failed[@]}): ${failed[*]:-—}"
                  if [ "${#failed[@]}" -gt 0 ]; then
                      echo "::error title=Publish incomplete::${#failed[@]} package(s) failed to publish: ${failed[*]}. ENEEDAUTH/E403 here almost always means that package's npm Trusted Publisher is missing or doesn't match — it must be GitHub Actions, repo rejifald/StitchAPI, workflow npm-publish.yml, no environment. Fix those on npmjs.com, then re-run this job; already-published packages are skipped, so the re-run only retries the failures."
                      exit 1
                  fi
                  echo "✓ all publishable packages are on the registry at $TAG"

    # Release-attached SBOM. `--provenance` above proves WHERE each tarball was built and
    # from which commit; an SBOM states WHAT is in the tree it was built from. Enterprise
    # procurement asks for the second artifact by name, and neither the provenance
    # attestation nor a zero-dependency badge substitutes for it.
    #
    # Both formats ship because buyers cite different ones: SPDX (ISO/IEC 5962) is what US
    # federal procurement references under EO 14028, CycloneDX is what most scanners
    # ingest natively. Generating both costs one extra Syft pass.
    #
    # Runs after publish so an SBOM never describes a release that failed to reach the
    # registry, and deliberately does NOT `pnpm install`: Syft reads pnpm-lock.yaml
    # directly, so the SBOM describes the committed lockfile rather than whatever a fresh
    # resolve happened to produce on the day of the run.
    sbom:
        needs: publish-npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # attach the SBOMs as GitHub release assets
        steps:
            - uses: actions/checkout@v7

            - name: Generate SPDX SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  path: .
                  format: spdx-json
                  output-file: stitchapi-${{ github.event.release.tag_name }}.spdx.json
                  upload-artifact: false
                  upload-release-assets: false

            - name: Generate CycloneDX SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  path: .
                  format: cyclonedx-json
                  output-file: stitchapi-${{ github.event.release.tag_name }}.cdx.json
                  upload-artifact: false
                  upload-release-assets: false

            # `gh release upload` rather than the action's own uploader: it is one legible
            # step for both files, and --clobber makes a re-run after a partial publish
            # idempotent the same way the publish loop above is.
            - name: Attach SBOMs to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  gh release upload "$TAG" \
                      "stitchapi-$TAG.spdx.json" \
                      "stitchapi-$TAG.cdx.json" \
                      --clobber
                  echo "✓ SPDX + CycloneDX SBOMs attached to release $TAG"
