# The verify gate: same checks as the local lefthook hooks, on every PR + push to
# an integration branch. Green is required to merge. See ~/Development/handbook
# conventions/global/ci-canonical.md.
name: Verify

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

# Default-deny; this gate only reads the repo.
permissions:
    contents: read

# Cancel superseded PR runs; let integration-branch runs queue.
concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Cheap → expensive: a fast failure surfaces first.
            - run: pnpm check:format
            - run: pnpm check:lint
            - run: pnpm check:types
            - run: pnpm test
            - run: pnpm check:exports
