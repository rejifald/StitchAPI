# The verify gate: same checks as the local lefthook hooks, on every PR + push to
# an integration branch. Green is required to merge. See ~/Development/handbook
# conventions/global/ci-canonical.md.
name: Verify

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
    # Re-verify the *merged* result in the queue. A `pull_request` run only tests
    # the PR against the base as it was when CI last ran; if another PR changes an
    # interacting file before this one lands (e.g. the root pnpm.overrides), the PR
    # can be green yet break main. `merge_group` runs these jobs against the actual
    # merge candidate, so `verify` re-runs its frozen install + docs build against the
    # post-merge base. This trigger is inert until the `main` branch protection enables
    # the GitHub merge queue (or, at minimum, "Require branches to be up to date before
    # merging") with `verify` as a required check — that setting is what actually blocks
    # the stale-base merge that broke the deploy.
    merge_group:

# Default-deny; this gate only reads the repo.
permissions:
    contents: read

# Cancel superseded PR runs; let integration-branch runs queue.
concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify-static:
        runs-on: ubuntu-latest
        # Static/source-scan slice of the old serial `verify` job: formatting,
        # lint, and the five checks that are explicitly tool-free or text-only
        # scans with no compiler or build involved (docs-links, both contract
        # ratchets, changelog shape, release coherence). This is the cheapest
        # of the three split jobs. 10 is a conservative, generous-headroom
        # estimate, not a measurement — there is no per-job timing history yet
        # since this is the first run after the split; tighten once real runs
        # land.
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            # Workflow-SCHEMA lint, first because it needs no toolchain and fails in ~2s.
            #
            # Nothing here validated workflow files, and the gap is not academic: this very
            # split shipped with no `runs-on` on its three new jobs. A missing required key
            # makes GitHub reject the WHOLE FILE, not the job — so no run happened at all,
            # and the PR sat BLOCKED with nothing pending and nothing failed, because the
            # required check could not report. Two independent parse-based checks missed it,
            # because `yaml.parse()` proves a file is well-formed YAML and says nothing about
            # the Actions schema. actionlint reads the schema: on that exact file it says
            # `"runs-on" section is missing in job "verify-static" [syntax-check]` and exits 1.
            #
            # The official release binary, version-pinned and checksum-verified against the
            # published checksums.txt — NOT the `actionlint` npm package, which is a
            # third-party wasm republish, last touched in 2022 (upstream ships 1.7.x), with no
            # repository field. A required gate in a repo that SHA-pins every action should not
            # rest on that. Bump by editing the two env values together.
            - name: actionlint (workflow schema)
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  set -euo pipefail
                  curl -fsSL -o actionlint.tar.gz \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
                  tar -xzf actionlint.tar.gz actionlint
                  ./actionlint -color
                  rm -f actionlint actionlint.tar.gz
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Lockfile-integrity gate (step 1 of the node half, so drift fails this job in ~20s). A frozen
            # install fails when pnpm-lock.yaml has drifted from any workspace manifest OR
            # from the root pnpm.overrides — the case that broke the Vercel deploy: a
            # security override (esbuild@<0.28.1 → >=0.28.1) rewrote a manifest spec the
            # lockfile never recorded. This install is implicitly `--frozen` in every
            # CI/deploy environment, and on merge_group it runs against the post-merge
            # base — the angle a per-PR run misses. (size/sandbox/e2e repeat it as their
            # own step 1; this is the fast, stable one to make a required check.)
            - run: pnpm install --frozen-lockfile
            # Cheap → expensive: a fast failure surfaces first.
            - run: pnpm check:format
            - run: pnpm check:lint
            # Docs internal-link integrity: every /docs/... link in the .mdx content must resolve
            # to a real page (catches a dead link like the removed fluent-builder page or a section
            # with no index). Static scan — no build needed.
            - run: pnpm check:docs-links
            # API meta-contract ratchet (docs/CONTRACT.md): fails on a NEW naming/typing/
            # shorthand/duration violation in the published surface, baselined against
            # scripts/contract-violations.baseline.json. Tool-free source scan — no build.
            - run: pnpm check:contract
            # Unknown-key guard ratchet: every authoring surface that infers `const C` from an
            # option-bag argument must intersect `NoUnknownKeys`, or be baselined with a reason
            # in scripts/unknown-keys.baseline.json. Without the guard, that inference suppresses
            # excess-property checking, so a misspelled or REMOVED slot typechecks and is
            # silently dropped — which is what makes a slot rename unsafe. Source scan — no build.
            - run: pnpm check:unknown-keys
            # CHANGELOG shape: one `###` section per kind per release block, and the
            # Keep a Changelog order within [Unreleased]. A branch cut from an older
            # `main` re-adds a heading its base lacked; git merges both cleanly because
            # they sit at different offsets, and Unreleased ends up with two `Added`s
            # (#620) or two `Fixed`s (#597). Text-only scan — no build.
            - run: pnpm check:changelog
            # Release coherence: version lockstep + prerelease-aware peer ranges +
            # scoped publishConfig.access, LICENSE/README presence, so a bad bump fails
            # the PR, not the publish.
            - run: pnpm check:release

    verify-compile-test:
        runs-on: ubuntu-latest
        # Compile + test slice of the old serial `verify` job: the workspace
        # typecheck (which builds every package's d.ts), the tsd assertion
        # suite, the full test suite, and both attw export-shape checks. The
        # typecheck and full test run were historically the heaviest stretch
        # of the combined job (see the `verify` aggregator job's comment for
        # the pre-split timing), so this gets the largest timeout of the three
        # split jobs. 15 is a conservative, generous-headroom estimate, not a
        # measurement — there is no per-job timing history yet since this is
        # the first run after the split; tighten once real runs land.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Repeated per job now that `verify` is split into independent jobs
            # that each need their own frozen install — see the `verify-static`
            # job above for why this is a lockfile-integrity gate, not just
            # dependency setup.
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:types
            # The tsd assertion suite — inference expectations (`expectType`,
            # `@ts-expect-error`) that `check:types` does NOT cover, because tsc only
            # proves the code compiles, not that a stitch still INFERS the output type a
            # consumer relies on. It ran on the pre-push hook but never in CI, so a push
            # with `--no-verify` could land an inference regression unseen.
            - run: pnpm check:types-d
            - run: pnpm test
            - run: pnpm check:exports
            # attw on every COMPANION too (core is covered by check:exports above). Uses core's
            # installed @arethetypeswrong/cli binary — no companion devDep / lockfile change.
            - run: pnpm check:exports:companions

    verify-docs:
        runs-on: ubuntu-latest
        # Docs slice of the old serial `verify` job: regenerate the docs
        # content, fail on drift, then build the docs app (a Fumadocs static
        # build over every page — see the render-gate comment on the build
        # step below). The docs-app build was one of the heavier steps in the
        # combined job, comparable in cost to the compile + test slice, so it
        # gets the same 15-minute cap. 15 is a conservative, generous-headroom
        # estimate, not a measurement — there is no per-job timing history yet
        # since this is the first run after the split; tighten once real runs
        # land.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Repeated per job now that `verify` is split into independent jobs
            # that each need their own frozen install — see the `verify-static`
            # job above for why this is a lockfile-integrity gate, not just
            # dependency setup.
            - run: pnpm install --frozen-lockfile
            # README badge/table drift (code health, coverage, license, package tables)
            # is now yakir tethers (readme-badges / readme-packages / core-integrations),
            # enforced by the `drift-executable` job in drift.yml. Refresh the badge
            # numbers with `pnpm metrics` (runs fallow + coverage, then --refresh).
            # Playground autocomplete drift (the generated artifact vs core `src/`) is now a
            # yakir tether (`playground-completions`, a whole-file compare against the generator's
            # --emit output), enforced by the `drift-executable` job in drift.yml. The pre-commit
            # `completions` job still regenerates + stages so a dev never commits a stale artifact.
            # Docs IA drift guard: content.manifest.ts is the source of truth for the sidebar,
            # but pages get added straight into the per-folder meta.json files, so the manifest
            # silently rots and a stray `gen:docs` would delete real pages. Regenerate and fail
            # if any meta.json drifted from the manifest (two-way sync is also unit-tested in
            # apps/docs/test/content-manifest.spec.ts). Mirrors the completions gate above.
            - run: pnpm --filter @stitchapi/docs gen:docs
            - run: git diff --exit-code apps/docs/content/docs
            # Render gate: `tsc` type-checks the docs but never renders a page, so a
            # broken AutoTypeTable path/name, an unregistered MDX component, or a
            # generator throw all pass type-check and only fail at build. Building the
            # docs app runs generateStaticParams over every page and surfaces those.
            - run: pnpm --filter @stitchapi/docs build

    verify:
        # This job's ONLY purpose is to keep the required-check name `verify`
        # alive for branch protection on `main`. Branch protection requires a
        # status check named exactly `verify`; if the split above had replaced
        # it outright with verify-static/verify-compile-test/verify-docs and
        # nothing named `verify` remained, every future PR would block forever
        # on a required check that can no longer report — and only a repo
        # admin can fix that, from GitHub's branch-protection settings, not
        # from this file. So `verify` stays: a no-op that does none of the
        # actual checking itself and goes green only when every job it depends
        # on does. Do not "clean up" or remove this job, and do not fold its
        # dependencies back into one job without first repointing branch
        # protection's required-check list.
        #
        # History: this used to be one serial job — frozen install, format,
        # lint, both contract ratchets, the workspace typecheck (which builds
        # every package's d.ts), tsd, the full test suite, `check:exports`,
        # and the docs-app build, all end to end. It ran 8m46s on `9b98bfe5`,
        # then timed out at 10m16s and 10m17s on the next two `main` commits —
        # a re-run of that unchanged commit went 10m18s → 8m47s, so the cap
        # was firing on runner variance, not a runaway job. PR #796 raised the
        # cap 10 → 20 as a stopgap and said splitting the job was the real
        # fix. This is that split: the three jobs above now run in parallel,
        # so wall time is max(job) instead of sum(steps).
        needs: [verify-static, verify-compile-test, verify-docs]
        # Default `needs` semantics SKIP this job when a dependency fails, and
        # a skipped job is not this required check honestly reporting failure.
        # `always()` makes the job run regardless of its dependencies' outcome,
        # so the step's own `if` below is what actually decides green/red —
        # "goes green only when all three do" is true by construction, not by
        # accident of the default skip behaviour.
        #
        # The step tests for `skipped` too, not just failure/cancellation. No
        # job above can be skipped today — none carries an `if:` or a path
        # filter — but the day one gains either, a skipped dependency would
        # otherwise let this required check report GREEN for work that never
        # ran, which is the same "reports something other than the truth"
        # failure the whole job exists to prevent. Cheaper to be exhaustive
        # about what "not success" means than to rediscover it later.
        if: always()
        runs-on: ubuntu-latest
        # Trivial — one conditional over three already-finished jobs. 5 is
        # pure headroom, not a real budget.
        timeout-minutes: 5
        steps:
            - name: Fail if any split verify job failed or was cancelled
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
              run: |
                  echo "::error::one or more of verify-static/verify-compile-test/verify-docs did not succeed"
                  exit 1

    # Bundle-size budget gate (packages/core/scripts/bundle-size.mjs): the core entry
    # has a min+gzip ceiling, so a change that bloats `import { stitch }` fails here
    # unless the budget is deliberately raised in the same PR. It measures the BUILT
    # lib/, so it builds core first and runs as its own job.
    size:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter stitchapi check:size
            # Advertised bundle sizes (READMEs, docs, homepage) matching the measured
            # figure is now a yakir tether (`bundle-advertised-size`), enforced by the
            # `drift-executable` job in drift.yml (it builds core and measures the same way).

    # Coverage gate: core declares coverage thresholds (packages/core/vitest.config.ts), so a drop
    # below them fails here. Runs core's instrumented suite (`test:coverage`) in its own job rather
    # than slowing the fast `pnpm test` gate above; uses the in-repo `@vitest/coverage-v8` devDep.
    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi test:coverage

    # The docs/sandbox playground smoke suites (docs/sandbox/tests/run-all.mjs) import the BUILT
    # `stitchapi`, so they are build-dependent integration tests — they run in their own job that
    # builds core first, not in the src-only `pnpm test` gate above.
    #
    # The five @stitchapi/sandbox-sim suites, by contrast, import source directly (not the build),
    # so they ride the `pnpm test` (`pnpm -r test`) gate in the `verify` job above via that
    # package's own `test` script — no separate job needed.
    sandbox:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter @stitchapi/sandbox test:smoke
            # The `stitch-sandbox` bin (docs/sandbox/package.json #/bin): `test:mcp` runs
            # `build:mcp` and then spawns the BUILT dist/mcp.mjs over stdio JSON-RPC, so it
            # is the only check that proves the bundle actually IMPORTS. Nothing else covers
            # it — the bundle is git-ignored and built by no other job — which is how it
            # shipped broken: the build had no `__PKG_VERSION__` define, so core's src/mcp.ts
            # kept the placeholder and the bin died at import. Its own build step; does not
            # need the `stitchapi build` above (it aliases `stitchapi` → core src).
            - run: pnpm --filter @stitchapi/sandbox test:mcp

    # `stitch mcp` over a real subprocess (packages/core/test/mcp-e2e.spec.ts): spawns the built
    # `bin/stitch mcp` and drives a full agent conversation (initialize → tools/list → run_stitch)
    # over stdio JSON-RPC against a hermetic local server. The bin requires lib/cli.js and the temp
    # stitch module imports lib/index.mjs, so it is build-dependent — its own job that builds core
    # first, like `size`/`sandbox`. In the src-only `pnpm test` gate (no lib/) the suite self-skips.
    mcp-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter stitchapi test:mcp-e2e

    # Browser-sandbox security model (§2.13): the Playwright harness proves the real CSP +
    # Worker egress blocking and that a real RunResult.trace reaches the playground DAG. It
    # builds the docs app and drives a headless Chromium, so it runs as its own job rather
    # than inside the `verify` gate. Already a required check on `main`.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @stitchapi/docs test:e2e:install
            - run: pnpm --filter @stitchapi/docs test:e2e

    # Docs search-relevance ratchet (apps/docs/scripts/search-eval.mts --assert): builds the
    # semantic search index the deploy builds, then asserts every natural question in
    # apps/docs/test/search-golden.json still finds its page within reach (#5) and that the
    # aggregate Relevance@1 / MRR hold above their floors. This is the regression guard for
    # search_docs — it catches a content edit that silently drops a page out of its own
    # question's results (the >8/>30 misranks this ratchet was tuned to fix). It builds the
    # docs app and loads the local embedding model, so — like size/sandbox/e2e — it runs as
    # its own job rather than in the fast `verify` gate. Required on `main` since 2026-08-28,
    # once the model fetch below stopped depending on a live HuggingFace CDN.
    search-relevance:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Vendor the embedding model into apps/docs/.model-cache and run the eval
            # against THAT, so this job is network-free like the rest of `verify`.
            #
            # It used to cache transformers.js's own in-node_modules download dir, keyed
            # on `hashFiles('pnpm-lock.yaml')` with no restore-keys — which meant the
            # highest-volume PR class here, a dependabot bump, could never hit it: the
            # lockfile IS the change, so the key was always new. Actions cache
            # ref-scoping then stopped those PRs from reading each other's entries, so
            # the repo piled up eight 83 MB caches under eight lockfile hashes and every
            # dependabot PR still re-downloaded the model mid-eval. Four such runs
            # started within 40 seconds on 2026-08-28; #758 lost that race, took a 429
            # from the HuggingFace CDN, and failed before one relevance assertion ran.
            #
            # So: key on the model's real identity (repo + dtype + transformers version,
            # see the script), cache the vendored dir at a stable path instead of a
            # pnpm-hashed one, and confine every possible network call to the one fetch
            # step below — which is retried, and a no-op whenever the cache restores.
            - id: embed-model
              # pipefail + the empty check because the pipe would otherwise swallow a
              # failing script and hand actions/cache an empty key.
              run: |
                  set -euo pipefail
                  KEY="$(pnpm --filter @stitchapi/docs --silent run embed-model-cache-key | tail -n1)"
                  if [ -z "$KEY" ]; then
                      echo "::error::could not compute the embedding-model cache key"
                      exit 1
                  fi
                  echo "Model cache key: $KEY"
                  echo "key=$KEY" >> "$GITHUB_OUTPUT"
            # restore-keys so even a genuine key change (a transformers bump, an
            # EMBED_MODEL/EMBED_DTYPE edit) starts from the previous copy rather than a
            # cold ~83 MB pull: transformers.js checks per file, so the fetch below then
            # asks only for what actually differs.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: apps/docs/.model-cache
                  key: ${{ steps.embed-model.outputs.key }}
                  restore-keys: embed-model-
            - run: pnpm --filter @stitchapi/docs fetch:embed-model
            # VENDORED_EMBED_MODEL pins embed.ts to .model-cache with
            # allowRemoteModels=false, so a vendoring failure fails loudly here instead
            # of silently re-downloading the model in the middle of the eval.
            - run: pnpm --filter @stitchapi/docs check:search-relevance
              env:
                  VENDORED_EMBED_MODEL: '1'
