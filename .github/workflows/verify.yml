# The verify gate: same checks as the local lefthook hooks, on every PR + push to
# an integration branch. Green is required to merge. See ~/Development/handbook
# conventions/global/ci-canonical.md.
name: Verify

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]
    # Re-verify the *merged* result in the queue. A `pull_request` run only tests
    # the PR against the base as it was when CI last ran; if another PR changes an
    # interacting file before this one lands (e.g. the root pnpm.overrides), the PR
    # can be green yet break main. `merge_group` runs these jobs against the actual
    # merge candidate, so `verify` re-runs its frozen install + docs build against the
    # post-merge base. This trigger is inert until the `main` branch protection enables
    # the GitHub merge queue (or, at minimum, "Require branches to be up to date before
    # merging") with `verify` as a required check — that setting is what actually blocks
    # the stale-base merge that broke the deploy.
    merge_group:

# Default-deny; this gate only reads the repo.
permissions:
    contents: read

# Cancel superseded PR runs; let integration-branch runs queue.
concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Lockfile-integrity gate (step 1, so drift fails this job in ~20s). A frozen
            # install fails when pnpm-lock.yaml has drifted from any workspace manifest OR
            # from the root pnpm.overrides — the case that broke the Vercel deploy: a
            # security override (esbuild@<0.28.1 → >=0.28.1) rewrote a manifest spec the
            # lockfile never recorded. This install is implicitly `--frozen` in every
            # CI/deploy environment, and on merge_group it runs against the post-merge
            # base — the angle a per-PR run misses. (size/sandbox/e2e repeat it as their
            # own step 1; this is the fast, stable one to make a required check.)
            - run: pnpm install --frozen-lockfile
            # Cheap → expensive: a fast failure surfaces first.
            - run: pnpm check:format
            - run: pnpm check:lint
            - run: pnpm check:types
            - run: pnpm test
            - run: pnpm check:exports
            # attw on every COMPANION too (core is covered by check:exports above). Uses core's
            # installed @arethetypeswrong/cli binary — no companion devDep / lockfile change.
            - run: pnpm check:exports:companions
            # Docs internal-link integrity: every /docs/... link in the .mdx content must resolve
            # to a real page (catches a dead link like the removed fluent-builder page or a section
            # with no index). Static scan — no build needed.
            - run: pnpm check:docs-links
            # API meta-contract ratchet (docs/CONTRACT.md): fails on a NEW naming/typing/
            # shorthand/duration violation in the published surface, baselined against
            # scripts/contract-violations.baseline.json. Tool-free source scan — no build.
            - run: pnpm check:contract
            # Release coherence: version lockstep + prerelease-aware peer ranges +
            # scoped publishConfig.access, LICENSE/README presence, so a bad bump fails
            # the PR, not the publish.
            - run: pnpm check:release
            # README badge/table drift (code health, coverage, license, package tables)
            # is now yakir tethers (readme-badges / readme-packages / core-integrations),
            # enforced by the `drift-executable` job in drift.yml. Refresh the badge
            # numbers with `pnpm metrics` (runs fallow + coverage, then --refresh).
            # Playground autocomplete drift (the generated artifact vs core `src/`) is now a
            # yakir tether (`playground-completions`, a whole-file compare against the generator's
            # --emit output), enforced by the `drift-executable` job in drift.yml. The pre-commit
            # `completions` job still regenerates + stages so a dev never commits a stale artifact.
            # Docs IA drift guard: content.manifest.ts is the source of truth for the sidebar,
            # but pages get added straight into the per-folder meta.json files, so the manifest
            # silently rots and a stray `gen:docs` would delete real pages. Regenerate and fail
            # if any meta.json drifted from the manifest (two-way sync is also unit-tested in
            # apps/docs/test/content-manifest.spec.ts). Mirrors the completions gate above.
            - run: pnpm --filter @stitchapi/docs gen:docs
            - run: git diff --exit-code apps/docs/content/docs
            # Render gate: `tsc` type-checks the docs but never renders a page, so a
            # broken AutoTypeTable path/name, an unregistered MDX component, or a
            # generator throw all pass type-check and only fail at build. Building the
            # docs app runs generateStaticParams over every page and surfaces those.
            - run: pnpm --filter @stitchapi/docs build

    # Bundle-size budget gate (packages/core/scripts/bundle-size.mjs): the core entry
    # has a min+gzip ceiling, so a change that bloats `import { stitch }` fails here
    # unless the budget is deliberately raised in the same PR. It measures the BUILT
    # lib/, so it builds core first and runs as its own job.
    size:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter stitchapi check:size
            # Advertised bundle sizes (READMEs, docs, homepage) matching the measured
            # figure is now a yakir tether (`bundle-advertised-size`), enforced by the
            # `drift-size` job in drift.yml (it builds core and measures the same way).

    # Coverage gate: core declares coverage thresholds (packages/core/vitest.config.ts), so a drop
    # below them fails here. Runs core's instrumented suite (`test:coverage`) in its own job rather
    # than slowing the fast `pnpm test` gate above; uses the in-repo `@vitest/coverage-v8` devDep.
    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi test:coverage

    # The docs/sandbox playground smoke suites (docs/sandbox/tests/run-all.mjs) import the BUILT
    # `stitchapi`, so they are build-dependent integration tests — they run in their own job that
    # builds core first, not in the src-only `pnpm test` gate above.
    #
    # The five @stitchapi/sandbox-sim suites, by contrast, import source directly (not the build),
    # so they ride the `pnpm test` (`pnpm -r test`) gate in the `verify` job above via that
    # package's own `test` script — no separate job needed.
    sandbox:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter @stitchapi/sandbox test:smoke

    # `stitch mcp` over a real subprocess (packages/core/test/mcp-e2e.spec.ts): spawns the built
    # `bin/stitch mcp` and drives a full agent conversation (initialize → tools/list → run_stitch)
    # over stdio JSON-RPC against a hermetic local server. The bin requires lib/cli.js and the temp
    # stitch module imports lib/index.mjs, so it is build-dependent — its own job that builds core
    # first, like `size`/`sandbox`. In the src-only `pnpm test` gate (no lib/) the suite self-skips.
    mcp-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter stitchapi build
            - run: pnpm --filter stitchapi test:mcp-e2e

    # Browser-sandbox security model (§2.13): the Playwright harness proves the real CSP +
    # Worker egress blocking and that a real RunResult.trace reaches the playground DAG. It
    # builds the docs app and drives a headless Chromium, so it runs as its own job rather
    # than inside the `verify` gate. Make it a required check once it has settled in CI.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @stitchapi/docs test:e2e:install
            - run: pnpm --filter @stitchapi/docs test:e2e

    # Docs search-relevance ratchet (apps/docs/scripts/search-eval.mts --assert): builds the
    # semantic search index the deploy builds, then asserts every natural question in
    # apps/docs/test/search-golden.json still finds its page within reach (#5) and that the
    # aggregate Relevance@1 / MRR hold above their floors. This is the regression guard for
    # search_docs — it catches a content edit that silently drops a page out of its own
    # question's results (the >8/>30 misranks this ratchet was tuned to fix). It builds the
    # docs app and loads the local embedding model, so — like size/sandbox/e2e — it runs as
    # its own job rather than in the fast `verify` gate. Make it a required check once it has
    # settled in CI.
    search-relevance:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Cache the local embedding model (all-MiniLM-L6-v2, ~23 MB) transformers.js pulls
            # into node_modules on the first index build, so a HuggingFace CDN hiccup can't flake
            # a required check. Keyed on the lockfile, so a transformers version bump re-fetches.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: node_modules/.pnpm/@huggingface+transformers@*/node_modules/@huggingface/transformers/.cache
                  key: transformers-model-${{ hashFiles('pnpm-lock.yaml') }}
            - run: pnpm --filter @stitchapi/docs check:search-relevance
