name: drift

# Fails the build when a tracked fact drifts between artifacts. Baseline lives in
# yakir.lock; the manifest is yakir.json. See https://github.com/rejifald/yakir.
#
# Two jobs, mirroring the token/executable tier split:
#   drift            — token tier: literal facts read straight from files (version
#                      lockstep + README quotes, engines.node, license across every
#                      published package.json). No install or build needed.
#   drift-executable — executable tier: facts that only a command knows —
#                      `bundle-advertised-size` (measures the built lib),
#                      `playground-completions`, and the README badge/table blocks
#                      (`readme-badges` / `readme-packages` / `core-integrations`,
#                      each a region vs. its generator's --emit). It installs (and
#                      builds core) first, like verify.yml's `size` job.

on:
    push:
        branches: [main]
    pull_request:
    # Both jobs below are REQUIRED checks on `main`, so the merge queue blocks on a
    # `drift` / `drift-executable` status for every queued merge candidate — without
    # this trigger the workflow never emits one and the queue deadlocks. Same
    # rationale as verify.yml besides: a `pull_request` run only proves the tethers
    # hold against the base as it was when CI last ran, and every fact here spans
    # artifacts two PRs can touch separately (a version bump vs. the README quoting
    # it), so both can be green and still disagree once merged. `merge_group` checks
    # the actual post-merge result.
    merge_group:

permissions:
    contents: read

# One group per ref, so runs of different PRs never queue behind each other. Cancel
# only superseded `pull_request` runs: a merge_group ref (refs/heads/gh-readonly-queue/…)
# is unique per queue entry and the queue is waiting on that status, so those must
# never be cancelled.
concurrency:
    group: drift-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    drift:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
            - run: npx --yes ./tools/yakir.tgz check --tier token

    drift-executable:
        runs-on: ubuntu-latest
        # 20, for the same reason as `verify` above it in verify.yml: the executable tier
        # BUILDS core before it can measure the advertised bundle size, so it carries the
        # same install+build cost and the same variance. Seen at 2m0s and at 10m14s (a
        # timeout) on the same commit.
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Install (for the completions generator's typescript dep) and build core
            # (so bundle-size.mjs can measure the real lib). --ignore-scripts skips the
            # lefthook `prepare` (CI provisions hooks differently).
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter stitchapi build
            - run: npx --yes ./tools/yakir.tgz check --tier executable
