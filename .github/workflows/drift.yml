name: drift

# Fails the build when a tracked fact drifts between artifacts. Baseline lives in
# yakir.lock; the manifest is yakir.json. See https://github.com/rejifald/yakir.
#
# Two jobs, mirroring the token/executable tier split:
#   drift       — token tier: literal facts (the README version vs. the package
#                 source). Reads files only, so it needs no install or build.
#   drift-size  — executable tier: the `bundle-advertised-size` tether MEASURES the
#                 real bundle by running bundle-size.mjs against built lib, so this
#                 job installs + builds core first (like verify.yml's `size` job).

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    drift:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - run: npx --yes ./tools/yakir.tgz check --tier token

    drift-size:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Build core so bundle-size.mjs can measure the real lib; --ignore-scripts
            # skips the lefthook `prepare` (CI provisions hooks differently).
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm --filter stitchapi build
            - run: npx --yes ./tools/yakir.tgz check --only bundle-advertised-size
