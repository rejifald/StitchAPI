# Git hooks — same gates as CI (.github/workflows/verify.yml).
# Activated by `lefthook install`, run automatically via the root package.json
# "prepare" script on `pnpm install`.

# Every `glob:` below is matched with doublestar, NOT lefthook's default gobwas
# engine. Under gobwas, `**/` requires at least one directory, so `**/*.ts` matches
# `packages/core/src/a/b.ts` but silently skips BOTH root-level files and the first
# level under a named prefix — `README.md`, `package.json`, and `lefthook.yml` itself
# were never formatted at commit time, and `packages/core/src/*.ts` (index.ts,
# stitch.ts, types.ts — the most-edited files in the package) never triggered the
# completions regen. doublestar gives `**` its standard meaning of zero-or-more
# directories, so each glob covers what it plainly reads as. Verified by probe on
# 2.1.10: under gobwas the `format` glob missed all three root files and
# `completions` saw only the nested `a/b.ts`. The `yakir` glob is unaffected: its
# only wildcard, `packages/*/package.json`, resolves to the same set under both
# engines. Applies to `glob:` matching only, so it is safe to read every pattern
# here as ordinary shell-style globbing.
glob_matcher: doublestar

# Every `run:` below starts with `{setup}`, which sources tools/hook-env.sh.
#
# Git hooks run in a non-interactive shell that reads no shell rc, so a PATH
# built by nvm/fnm/asdf or by corepack's shims is absent and every `pnpm ...`
# job dies with `sh: pnpm: command not found` — from a checkout where pnpm works
# fine in the terminal. GUI git clients, editor commit UIs, and agent sessions
# hit this; a plain `git commit` from a configured terminal does not, which is
# why it looks intermittent. hook-env.sh puts those locations back.
#
# It rides a template rather than lefthook's own top-level `rc:` key because as
# of lefthook 2.1.10 `rc:` is accepted by the config schema but never sourced for
# `jobs` — verified by probe, so don't "simplify" this back to `rc:` without
# re-testing. Machine-specific tweaks belong in ~/.lefthookrc, which
# hook-env.sh sources when present.
templates:
    setup: '. ./tools/hook-env.sh &&'

pre-commit:
    parallel: false
    jobs:
        # Regenerate the playground autocomplete maps when the core source that
        # feeds the generator changes, then stage the result so the committed
        # *.generated.ts never drifts from the types it mirrors. The generator
        # reads packages/core/src directly (no build step), so this stays cheap.
        # Keep this glob in sync with the `packages` list in
        # apps/docs/scripts/gen-stitch-completions.mjs.
        - name: completions
          glob: 'packages/core/src/**/*.ts'
          run: '{setup} pnpm --filter @stitchapi/docs run gen:completions && git add "apps/docs/app/(home)/playground/playground-completions.generated.ts"'
        # Drift gate (github.com/rejifald/yakir). Pre-commit runs the TOKEN tier
        # only — literal facts read straight from files, needing no build: the
        # version lockstep + README quotes, the engines.node floor, and the license,
        # across every published package.json. The executable-tier tethers
        # (`bundle-advertised-size` measures the built lib; `playground-completions`
        # re-runs the generator) can't run build-free, so they run at pre-push and in
        # CI (.github/workflows/drift.yml). Vendored tarball; manifest yakir.json,
        # baseline yakir.lock.
        - name: yakir
          glob: '{README.md,packages/core/README.md,packages/*/package.json,yakir.json,yakir.lock}'
          run: '{setup} npx --yes ./tools/yakir.tgz check --tier token'
        # The README badge/table drift guard is now yakir tethers (readme-badges,
        # readme-packages, core-integrations) — executable tier, so enforced at
        # pre-push and in drift.yml, not here. Refresh the numbers with `pnpm metrics`.
        - name: format
          # Keep in sync with CI's `prettier --check .` (verify.yml) — cover every
          # extension Prettier handles here so committed files are never left unformatted
          # (notably .mdx, which the docs are written in).
          glob: '**/*.{ts,tsx,js,jsx,mjs,cjs,json,md,mdx,yml,yaml,css}'
          run: '{setup} pnpm exec prettier --write {staged_files}'
          stage_fixed: true
        - name: lint
          glob: '**/*.ts'
          run: '{setup} pnpm check:lint'
        - name: typecheck
          run: '{setup} pnpm check:types'

pre-push:
    parallel: false
    # Run the FULL CI sequence (verify.yml) locally, cheap → expensive, so a push never
    # lands something CI rejects. Note `check:format` here is the whole-tree `prettier
    # --check .` — unlike pre-commit's format job, which only rewrites the files in THIS
    # commit, it catches any tracked file (in any extension) that drifted out of style,
    # including ones an earlier commit landed unformatted.
    jobs:
        - name: format
          run: '{setup} pnpm check:format'
        - name: lint
          run: '{setup} pnpm check:lint'
        # API meta-contract ratchet (docs/CONTRACT.md). Cheap source scan, fail-fast before
        # the expensive test/build jobs. Mirrors CI's check:contract step.
        - name: contract
          run: '{setup} pnpm check:contract'
        # Unknown-key guard ratchet: a generic-inferred option bag with no `NoUnknownKeys`
        # intersection lets a misspelled or removed slot typecheck and be silently dropped.
        # Cheap source scan, same tier as the contract ratchet. Mirrors CI's step.
        - name: unknown-keys
          run: '{setup} pnpm check:unknown-keys'
        # CHANGELOG shape: one `###` section per kind per release block, plus the Keep a
        # Changelog order within [Unreleased]. Catches the second `Added`/`Fixed` a branch
        # cut from an older `main` grafts on — git merges both cleanly, so nothing else
        # notices. Text-only scan. Mirrors CI's step.
        - name: changelog
          run: '{setup} pnpm check:changelog'
        # Demo-media drift gate (docs/media/README.md): a branch that edits the
        # demo scene or its generator must also regenerate the committed README
        # webp pair. Cheap path diff; STITCH_MEDIA_STALE_OK=1 defers.
        - name: media-fresh
          run: '{setup} pnpm check:media-fresh'
        - name: typecheck
          run: '{setup} pnpm check:types'
        # Type-level tests (tsd) for the inferred public API — builds the package's d.ts and
        # asserts `stitch({ output: schema })` resolves to the right `Stitch<T>`.
        - name: typecheck-d
          run: '{setup} pnpm check:types-d'
        - name: test
          run: '{setup} pnpm test'
        - name: exports
          run: '{setup} pnpm check:exports'
        # Render gate — see verify.yml. `tsc` never renders a page, so building the
        # docs app is what actually exercises AutoTypeTable and MDX components.
        - name: build-docs
          run: '{setup} pnpm --filter @stitchapi/docs build'
        # Full yakir drift check, MEASURED. Pre-commit runs the token tier only
        # (no build), so the executable-tier `bundle-advertised-size` tether — which
        # runs bundle-size.mjs against built lib — is enforced here and in CI. Build
        # core so the measurement is real, then assert every advertised `~NN kB`
        # quote matches it, catching the stale-but-consistent case before the push.
        - name: yakir
          run: '{setup} pnpm --filter stitchapi build && npx --yes ./tools/yakir.tgz check'
