# Git hooks — same gates as CI (.github/workflows/verify.yml).
# Activated by `lefthook install`, run automatically via the root package.json
# "prepare" script on `pnpm install`.
pre-commit:
    parallel: false
    jobs:
        # Regenerate the playground autocomplete maps when the core source that
        # feeds the generator changes, then stage the result so the committed
        # *.generated.ts never drifts from the types it mirrors. The generator
        # reads packages/core/src directly (no build step), so this stays cheap.
        # Keep this glob in sync with the `packages` list in
        # apps/docs/scripts/gen-stitch-completions.mjs.
        - name: completions
          glob: 'packages/core/src/**/*.ts'
          run: pnpm --filter @stitchapi/docs run gen:completions && git add "apps/docs/app/(home)/playground/playground-completions.generated.ts"
        # Catch a partial edit to the advertised bundle size before it lands. No
        # build here, so this runs the consensus check (every quote must agree);
        # CI's `size` job does the authoritative measured check. Keep this glob in
        # sync with the FILES list in scripts/check-size-docs.mjs.
        - name: size-docs
          glob: '{README.md,packages/core/README.md,apps/docs/**/installation.mdx,apps/docs/**/principles.mdx,apps/docs/**/metrics.tsx,apps/docs/lib/source.ts,packages/core/scripts/bundle-size.mjs}'
          run: pnpm check:size-docs
        # README metrics badge block must match the committed snapshot. Tool-free
        # drift guard (renders from scripts/readme-metrics.snapshot.json) — mirrors
        # CI's check:readme step. Refresh the numbers with `pnpm metrics`.
        - name: readme-metrics
          glob: '{README.md,scripts/readme-metrics.snapshot.json,scripts/gen-readme-metrics.mjs}'
          run: pnpm check:readme
        - name: format
          # Keep in sync with CI's `prettier --check .` (verify.yml) — cover every
          # extension Prettier handles here so committed files are never left unformatted
          # (notably .mdx, which the docs are written in).
          glob: '**/*.{ts,tsx,js,jsx,mjs,cjs,json,md,mdx,yml,yaml,css}'
          run: pnpm exec prettier --write {staged_files}
          stage_fixed: true
        - name: lint
          glob: '**/*.ts'
          run: pnpm check:lint
        - name: typecheck
          run: pnpm check:types

pre-push:
    parallel: false
    # Run the FULL CI sequence (verify.yml) locally, cheap → expensive, so a push never
    # lands something CI rejects. Note `check:format` here is the whole-tree `prettier
    # --check .` — unlike pre-commit's format job, which only rewrites the files in THIS
    # commit, it catches any tracked file (in any extension) that drifted out of style,
    # including ones an earlier commit landed unformatted.
    jobs:
        - name: format
          run: pnpm check:format
        - name: lint
          run: pnpm check:lint
        # API meta-contract ratchet (docs/CONTRACT.md). Cheap source scan, fail-fast before
        # the expensive test/build jobs. Mirrors CI's check:contract step.
        - name: contract
          run: pnpm check:contract
        - name: typecheck
          run: pnpm check:types
        # Type-level tests (tsd) for the inferred public API — builds the package's d.ts and
        # asserts `stitch({ output: schema })` resolves to the right `Stitch<T>`.
        - name: typecheck-d
          run: pnpm check:types-d
        - name: test
          run: pnpm test
        - name: exports
          run: pnpm check:exports
        # Render gate — see verify.yml. `tsc` never renders a page, so building the
        # docs app is what actually exercises AutoTypeTable and MDX components.
        - name: build-docs
          run: pnpm --filter @stitchapi/docs build
